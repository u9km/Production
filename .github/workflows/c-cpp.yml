name: libwebp-Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          brew install ldid

      - name: Build
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          make clean
          make package FINALPACKAGE=1
        
      - name: Extract & Sign
        run: |
          mkdir -p output
          find .theos/obj -name "*.dylib" -exec cp {} output/libwebp \;
          ldid -S output/libwebp

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: libwebp-normal-size
          path: output/libwebp
