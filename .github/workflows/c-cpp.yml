name: "Amar Zeus Theos Build"

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Theos Environment"
        run: |
          # تحميل وتثبيت Theos الرسمية على خادم البناء
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: "Build Tweak with Theos"
        run: |
          # أمر البنا البسيط بفضل الـ Makefile
          make package FINALPACKAGE=1
        env:
          THEOS: ~/theos

      - name: "Upload Dylib"
        uses: actions/upload-artifact@v4
        with:
          name: AmarShield-Theos-Dylib
          # Theos يضع الـ dylib الجاهز في هذا المسار المخفي
          path: .theos/obj/**/*.dylib
