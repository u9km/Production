name: Production Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build AmarShield
    runs-on: macos-latest

    env:
      THEOS: ${{ github.workspace }}/theos
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HOMEBREW_NO_AUTO_UPDATE: 1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: ${{ runner.os }}-theos-master

      - name: Setup Theos
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ldid
        run: brew install ldid

      - name: Build Tweak
        run: |
          make clean
          make package FINALPACKAGE=1
        
      # هذه الخطوة الجديدة تسحب الدايلب فقط وتضعه في مجلد مؤقت مسطح بدون مسارات
      - name: Extract Dylib Only
        run: |
          mkdir -p Final_Dylib
          find .theos/obj -name "*.dylib" -type f -exec cp {} Final_Dylib/ \;

      # رفع الملف المباشر بدون أي مجلدات زائدة
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmarShield-Dylib
          path: Final_Dylib/*.dylib
