name: "Amar Shield AtoZ Builder"

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Setup Xcode"
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: "Compile AmarShield"
        run: |
          # تأكد من أن أسماء الملفات مطابقة لما في المستودع
          xcrun -sdk iphoneos clang++ -dynamiclib -arch arm64 \
          -miphoneos-version-min=14.0 \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -fobjc-arc -framework Foundation -framework UIKit -lc++ \
          fishhook.c AmarShield_AtoZ_Final.mm -o AmarShield.dylib
          
          echo "✅ Build Complete: AmarShield.dylib created."

      - name: "Upload Dylib"
        uses: actions/upload-artifact@v4
        with:
          name: AmarShield-AtoZ-IPA-Ready
          path: AmarShield.dylib
