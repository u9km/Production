name: AutoBuild

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential perl git curl libssl-dev
          git clone --recursive https://github.com/theos/theos.git ~/theos
          # جلب رؤوس أقلام (Headers) النظام فقط بدلاً من SDK كامل
          mkdir -p ~/theos/sdks
          curl -L https://github.com/theos/sdks/raw/master/iPhoneOS14.5.sdk.tar.xz | tar -xJ -C ~/theos/sdks
          echo "THEOS=~/theos" >> $GITHUB_ENV
          echo "~/theos/bin" >> $GITHUB_PATH

      - name: Build Package
        run: make package FINALPACKAGE=1

      - name: Save Result
        uses: actions/upload-artifact@v4
        with:
          name: BlackIOS-Final
          path: packages/*.deb
