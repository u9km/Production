name: AmarShield Zeus - Production Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Zero-Trace Dylib
    runs-on: macos-latest

    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 📦 Cache Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: ${{ runner.os }}-theos-v1

      - name: ⚙️ Setup Theos Environment
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

      - name: 🛠️ Install ldid
        run: brew install ldid

      - name: 🚀 Compile AmarShield Zeus
        run: |
          make clean
          make package FINALPACKAGE=1
        
      - name: 🕵️‍♂️ Extract Dylib
        run: |
          mkdir -p Final_Dylib
          find .theos/obj -name "*.dylib" -type f -exec cp {} Final_Dylib/ \;
          
          echo "====================================="
          echo "🛡️ Dylib Compiled Successfully:"
          echo "====================================="
          ls -lh Final_Dylib/*.dylib

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmarShield-Zeus-Trinity-Dylib
          path: Final_Dylib/*.dylib
          if-no-files-found: error
