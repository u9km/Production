name: Turbo-Build-Zeus
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📦 Cache Theos & SDKs (سرعة التيربو)
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          # إذا أردت يوماً تحديث ثيوس، فقط غير v1 إلى v2 هنا
          key: theos-ios14-v1

      - name: ⚙️ Install Theos (فقط إذا لم يكن مخزناً)
        if: steps.cache-theos.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

      - name: 🚀 Build & Sign (بناء فوري)
        run: |
          brew install ldid
          export THEOS=$GITHUB_WORKSPACE/theos
          make clean
          make package FINALPACKAGE=1
          
          mkdir -p output
          cp .theos/obj/arm64/libwebp.dylib output/libwebp
          ldid -S output/libwebp

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libwebp-turbo
          path: output/libwebp
