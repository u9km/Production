name: Zeus-Production-Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    # تعريف المسار جذرياً لكل الخطوات لضمان عدم ضياعه
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Theos (Clean Direct Clone)
        run: |
          # مسح أي ملفات معطوبة من المحاولات السابقة
          rm -rf $THEOS
          
          # التحميل المباشر والسريع عبر Git (بدون حظر API)
          git clone --recursive https://github.com/theos/theos.git $THEOS
          
          # تثبيت أداة التوقيع
          brew install ldid

      - name: 🩹 Fix Missing Headers (ptrace.h)
        run: |
          # إنشاء مجلد sys داخل مسار include الخاص بـ Theos
          mkdir -p $THEOS/include/sys
          
          # كتابة ملف ptrace.h وتضمين الدوال المطلوبة للحماية وتجاوز التصحيح
          cat << 'EOF' > $THEOS/include/sys/ptrace.h
          #ifndef _SYS_PTRACE_H_
          #define _SYS_PTRACE_H_
          #include <sys/types.h>
          
          #define PT_TRACE_ME 0
          #define PT_DENY_ATTACH 31
          #define PT_ATTACH 16
          #define PT_DETACH 17
          
          extern "C" int ptrace(int request, pid_t pid, caddr_t addr, int data);
          #endif
          EOF

      - name: 🚀 Compile & Build
        run: |
          make clean
          make package FINALPACKAGE=1
        
      - name: 🛡️ Extract & Sign (Zero-Trust Bypass)
        run: |
          mkdir -p output
          cp .theos/obj/arm64/libwebp.dylib output/libwebp
          
          # توقيع الملف لتجاوز خطأ "تعذر التنزيل"
          ldid -S output/libwebp
          
          echo "====================================="
          echo "🛡️ Dylib Compiled Successfully:"
          ls -lh output/libwebp
          echo "====================================="

      - name: 📤 Upload Final Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libwebp-zeus-159
          path: output/libwebp
