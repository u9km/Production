name: "Amar Dylib Builder V4 - 2026"

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # للتشغيل اليدوي من زر Actions

jobs:
  build:
    # بناء dylib للايفون يتطلب نظام ماك حصراً
    runs-on: macos-latest

    steps:
      # 1. سحب الكود من المستودع الخاص بك
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد أدوات المطور (Xcode)
      - name: Setup Xcode Environment
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      # 3. عملية التجميع (Compilation)
      # هذا الأمر يجمع ملف AmarShield.mm مع fishhook.c لإنتاج dylib متوافق مع الايفون
      - name: Compile AmarShield Dylib
        run: |
          xcrun -sdk iphoneos clang++ -dynamiclib -arch arm64 \
          -miphoneos-version-min=14.0 \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -fobjc-arc \
          -framework Foundation \
          -framework UIKit \
          -framework Security \
          -lc++ \
          fishhook.c AmarShield.mm -o AmarShield.dylib
          
          echo "✅ تم بناء الملف بنجاح: AmarShield.dylib"

      # 4. رفع ملف الـ dylib الناتج لكي تتمكن من تحميله
      - name: Upload Resulting Dylib
        uses: actions/upload-artifact@v4
        with:
          name: Amar-NoJailbreak-Dylib
          path: AmarShield.dylib
