name: AmarShield Zeus - Production Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Zero-Trace Dylib (Trinity Protocol)
    runs-on: macos-latest

    env:
      THEOS: ${{ github.workspace }}/theos
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HOMEBREW_NO_AUTO_UPDATE: 1

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 📦 Cache Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: ${{ runner.os }}-theos-trinity-v1

      - name: ⚙️ Setup Theos Environment
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

      - name: 🛠️ Install Dependencies (ldid & cmake)
        run: brew install ldid cmake

      - name: 🧬 Compile & Inject Dobby Engine
        run: |
          if [ ! -f "$THEOS/lib/libdobby.a" ]; then
            echo "🛡️ Fetching Dobby Source..."
            git clone --depth 1 https://github.com/jmpews/Dobby.git dobby_src
            cd dobby_src
            mkdir build && cd build
            echo "⚙️ Compiling Dobby for iOS (ARM64)..."
            cmake .. -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
            make -j4
            echo "📦 Moving Dobby to Theos..."
            cp libdobby.a $THEOS/lib/
            cp ../include/dobby.h $THEOS/include/
            cd ../../
            rm -rf dobby_src
            echo "✅ Dobby Engine Installed Successfully!"
          else
            echo "⚡ Dobby is already cached in Theos."
          fi

      - name: 🚀 Compile AmarShield Zeus (Trinity Mode)
        run: |
          make clean
          make package FINALPACKAGE=1
        
      - name: 🕵️‍♂️ Extract Dylib
        run: |
          mkdir -p Final_Dylib
          find .theos/obj -name "*.dylib" -type f -exec cp {} Final_Dylib/ \;
          
          echo "====================================="
          echo "🛡️ Dylib Compilation Status:"
          echo "====================================="
          ls -lh Final_Dylib/*.dylib

      - name: 📤 Upload Artifact (Dylib Only)
        uses: actions/upload-artifact@v4
        with:
          name: AmarShield-Zeus-Trinity-Dylib
          path: Final_Dylib/*.dylib
          if-no-files-found: error
